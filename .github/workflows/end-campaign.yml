name: チェロ体験レッスン無料キャンペーン終了

# 2026-09-01 00:10 JST（= 2026-08-31 15:10 UTC）に自動実行。
# 手動実行も可能（Actionsタブの Run workflow）。
on:
  schedule:
    - cron: '10 15 31 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  end-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 実行日を判定（9/1以降のみ実行）
        id: check
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "今日(JST): $TODAY"
          if [[ "$TODAY" < "2026-09-01" ]]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "まだキャンペーン期間中のためスキップします"
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: 通常料金へ切り替え
        if: steps.check.outputs.run == 'true'
        run: python3 .github/scripts/end_campaign.py

      - name: 変更をコミット・公開
        if: steps.check.outputs.run == 'true'
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "変更なし（すでに切り替え済み）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "チェロ体験レッスン無料キャンペーン終了に伴い通常料金へ切り替え（自動実行）"
          git push
