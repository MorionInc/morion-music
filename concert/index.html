<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チェロ体験会＆ミニコンサート（終了）｜杜音ミュージック</title>
<meta name="description" content="2026年10月12日に開催したチェロ体験会＆ミニコンサートは終了しました。次回は年末の開催を予定しています。チェロ・ヴァイオリン・ヴィオラの体験レッスンは随時受け付けております。仙台市青葉区上杉、北四番丁駅 徒歩4分。">
<link rel="canonical" href="https://morionmusic.com/concert/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="杜音ミュージック">
<meta property="og:title" content="チェロ体験会＆ミニコンサート（終了）｜杜音ミュージック">
<meta property="og:description" content="2026年10月12日開催の体験会は終了しました。次回は年末の開催を予定しています。体験レッスンは随時受付中です。">
<meta property="og:url" content="https://morionmusic.com/concert/">
<meta property="og:image" content="https://morionmusic.com/images/cellos-ready.jpg">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="杜音ミュージックのレッスン室に並べられた複数のチェロ">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2e5339; --green-dark:#1f3a28; --green-light:#eef4ee;
    --cream:#faf7f0; --gold:#b08d57; --text:#333; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans JP",sans-serif;color:var(--text);background:var(--cream);
    line-height:1.9;display:flex;flex-direction:column;min-height:100vh;
  }
  header{background:#fff;padding:16px 20px;border-bottom:1px solid #ece5d8}
  .header-inner{max-width:1000px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;
    color:var(--green-dark);font-family:"Noto Serif JP",serif;font-weight:600}
  .logo img{height:38px}
  .logo small{display:block;font-size:.65rem;color:var(--gold);letter-spacing:.15em;font-weight:500}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px}
  .card{
    background:#fff;border-radius:var(--radius);box-shadow:0 4px 20px rgba(46,83,57,.08);
    max-width:680px;width:100%;padding:48px 38px;text-align:center;
  }
  .ribbon{
    display:inline-block;background:var(--green-light);color:var(--green-dark);
    border-radius:999px;padding:6px 20px;font-size:.84rem;font-weight:700;margin-bottom:20px;
  }
  h1{font-family:"Noto Serif JP",serif;color:var(--green-dark);font-size:1.6rem;line-height:1.6;margin-bottom:18px}
  .lead{font-size:.98rem;margin-bottom:28px}
  .photo{border-radius:var(--radius);overflow:hidden;margin:0 0 28px}
  .photo img{width:100%;height:auto;display:block}
  .next{
    background:var(--green-light);border-radius:10px;padding:20px 22px;
    text-align:left;font-size:.92rem;margin-bottom:28px;
  }
  .next b{color:var(--green-dark);display:block;margin-bottom:6px}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{
    display:inline-block;text-decoration:none;border-radius:999px;font-weight:700;
    padding:15px 38px;font-size:1rem;transition:.2s;min-width:280px;
  }
  .btn-main{background:var(--gold);color:#fff}
  .btn-main:hover{background:#c8a26b;transform:translateY(-2px)}
  .btn-sub{background:#fff;color:var(--green-dark);border:2px solid var(--green)}
  .btn-sub:hover{background:var(--green-light)}
  .tel{margin-top:22px;font-size:.88rem;color:#666}
  .tel a{font-family:"Noto Serif JP",serif;font-size:1.3rem;color:var(--green-dark);
    text-decoration:none;font-weight:600;display:block;margin-top:4px}

  footer{background:var(--green-dark);color:#cfe0d4;text-align:center;padding:26px 20px;font-size:.84rem}
  footer a{color:#f0d9a8}
  .jwrap span{display:inline-block}
  @media(max-width:600px){
    main{padding:34px 16px}
    .card{padding:34px 22px}
    h1{font-size:1.3rem}
    .btn{min-width:0;width:100%;padding:14px 20px}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="/"><img src="../images/logo-morion.png" alt="杜音ミュージック">
      <span>杜音ミュージック<small>MORION MUSIC</small></span></a>
  </div>
</header>

<main>
  <div class="card">
    <span class="ribbon">開催終了</span>
    <h1 class="jwrap"><span>チェロ体験会 ＆ ミニコンサートは</span><span>終了しました</span></h1>
    <p class="lead jwrap">
      <span>ご参加いただいたみなさま、</span><span>ありがとうございました。</span><br>
      <span>実際にチェロに触れていただく時間を</span><span>ご一緒できたこと、</span><span>うれしく思っております。</span>
    </p>

    <figure class="photo">
      <picture>
        <source srcset="../images/cellos-ready.webp" type="image/webp">
        <img src="../images/cellos-ready.jpg" width="1600" height="900"
             alt="杜音ミュージックのレッスン室に並べられた複数のチェロ" loading="lazy">
      </picture>
    </figure>

    <div class="next">
      <b>次回の開催について</b>
      年末の開催を予定しております。日程が決まりましたら、このページと公式サイトでお知らせします。
    </div>

    <p class="lead jwrap" style="margin-bottom:22px">
      <span>体験レッスンは随時受け付けております。</span><br>
      <span>楽器はこちらでご用意しますので、</span><span>手ぶらでお越しいただけます。</span>
    </p>

    <div class="btns">
      <a class="btn btn-main" href="/#contact">体験レッスンを申し込む</a>
      <a class="btn btn-sub" href="/">教室のご案内を見る</a>
    </div>

    <p class="tel">
      お電話でも承ります
      <a href="tel:05011252898">050-1125-2898</a>
    </p>
  </div>
</main>

<footer>
  <p>杜音ミュージック（運営：杜音株式会社）</p>
</footer>

</body>
</html>
