<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ただいまメンテナンス中｜杜音ミュージック</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --green:#2e5339; --green-dark:#1f3a28; --cream:#faf7f0; --gold:#b08d57; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Noto Sans JP",sans-serif; color:#333; background:var(--cream);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 20px; line-height:1.9;
  }
  .card{
    background:#fff; border-radius:16px; max-width:560px; width:100%;
    box-shadow:0 4px 24px rgba(46,83,57,.10); overflow:hidden; text-align:center;
  }
  .head{ background:linear-gradient(150deg,var(--green-dark),var(--green)); color:#fff; padding:34px 24px 28px; }
  .head img{ height:44px; margin-bottom:12px }
  .head .name{ font-family:"Noto Serif JP",serif; font-size:1.25rem; font-weight:700; letter-spacing:.05em }
  .head .en{ font-size:.62rem; letter-spacing:.22em; color:#e2cfa6; margin-top:2px }
  .body{ padding:34px 26px 30px }
  h1{ font-family:"Noto Serif JP",serif; font-size:1.3rem; color:var(--green-dark); margin-bottom:16px }
  .lead{ font-size:.95rem; color:#555 }
  .lead span{ display:inline-block }
  .contact{
    margin-top:26px; padding-top:24px; border-top:1px solid #eee7d8;
  }
  .contact .t{ font-size:.82rem; color:var(--gold); letter-spacing:.14em; margin-bottom:14px; font-weight:700 }
  .row{ display:flex; flex-direction:column; gap:12px; align-items:center }
  .btn{
    display:block; width:100%; max-width:340px; text-decoration:none;
    border-radius:99px; padding:14px 20px; font-weight:700;
    transition:opacity .15s;
  }
  .btn:hover{ opacity:.88 }
  .btn.tel{ background:var(--green); color:#fff; font-size:1.3rem; letter-spacing:.02em }
  .btn.tel small{ display:block; font-size:.7rem; font-weight:500; letter-spacing:.16em; opacity:.9 }
  .btn.mail{ background:#fff; color:var(--green-dark); border:2px solid var(--green); font-size:1rem; word-break:break-all }
  .btn.mail small{ display:block; font-size:.7rem; font-weight:500; color:#777; letter-spacing:.1em }
  .foot{ background:#f6f3ea; padding:16px 20px; font-size:.75rem; color:#888 }
  @media(max-width:420px){
    .btn.tel{ font-size:1.15rem }
    .btn.mail{ font-size:.9rem }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="images/logo-morion.png" alt="">
      <div class="name">杜音ミュージック</div>
      <div class="en">MORION MUSIC</div>
    </div>
    <div class="body">
      <h1>ただいまメンテナンス中です</h1>
      <p class="lead">
        <span>いつもありがとうございます。</span><span>ただいまホームページの</span><span>メンテナンスを行っております。</span><br>
        <span>ご不便をおかけいたしますが、</span><span>数日中に再開いたします。</span>
      </p>
      <div class="contact">
        <div class="t">お問い合わせ・体験レッスンのお申込み</div>
        <div class="row">
          <a class="btn tel" href="tel:05011252898"><small>お電話</small>050-1125-2898</a>
          <a class="btn mail" href="mailto:studio@morionviolin.com"><small>メール</small>studio@morionviolin.com</a>
        </div>
      </div>
    </div>
    <div class="foot">仙台市青葉区上杉1-9-11／運営：杜音株式会社</div>
  </div>
</body>
</html>
